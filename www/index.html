<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Pedidos</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f2f2f2}
header{background:#111;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:800}
.wrap{padding:14px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn-menu{padding:28px;font-size:22px;margin-bottom:14px}
.btn-menu small{display:block;font-size:14px;font-weight:400;color:#ddd;margin-top:4px}
.btn-back{background:#eee;color:#333;margin-bottom:12px}
.pedido{border-top:1px solid #eee;padding:12px 0}
.pedido b{font-size:17px} .small{color:#666;font-size:13px}
.del{background:#ff3b30;margin-top:8px}
.total{font-size:18px;font-weight:800;text-align:right}
.check-row{display:flex;gap:10px;margin-top:10px}
.check-box{flex:1;display:flex;align-items:center;gap:8px;background:#f7f7f7;border-radius:10px;padding:10px;font-size:14px;font-weight:700}
.check-box input{width:22px;height:22px;margin:0;accent-color:#111}
.check-box.on-pagado{background:#d9f7d9}
.check-box.on-entregado{background:#dbeafe}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700;margin-left:4px}
.badge-pagado{background:#d9f7d9;color:#0a6b0a}
.badge-entregado{background:#dbeafe;color:#0a4ab5}
.resumen{display:flex;gap:8px;text-align:center}
.resumen div{flex:1;background:#fff;border-radius:12px;padding:10px}
.resumen b{font-size:20px;display:block}
.nombre-cliente{font-size:19px;font-weight:800}
</style>
</head>
<body>
<header>📦 MIS PEDIDOS</header>
<div class="wrap">

<!-- MENU PRINCIPAL -->
<div id="menu">
  <button class="btn-menu" onclick="ir('pedidos')">📦 Pedidos<small>Agregar y ver pedidos guardados</small></button>
  <button class="btn-menu" onclick="ir('reporte')" style="background:#0a4ab5">🚚 Reporte de entrega<small>Ver clientes - Pagado / Entregado</small></button>
  <div class="resumen">
    <div><b id="r-total">0</b>Total pedidos</div>
    <div><b id="r-pagado">0</b>Pagados</div>
    <div><b id="r-entregado">0</b>Entregados</div>
  </div>
</div>

<!-- SECCION PEDIDOS -->
<div id="sec-pedidos" style="display:none">
  <button class="btn-back" onclick="ir('menu')">← Volver al menú</button>
  <div class="card">
    <h3 style="margin:0">Nuevo Pedido</h3>
    <input id="cliente" placeholder="Nombre del cliente">
    <input id="producto" placeholder="Producto">
    <input id="precio" type="number" placeholder="Precio $">
    <input id="cantidad" type="number" value="1" placeholder="Cantidad">
    <button onclick="agregar()">+ Agregar Pedido</button>
  </div>
  <div class="card">
    <h3 style="margin:0">Pedidos Guardados</h3>
    <div id="lista"></div>
    <div class="total" id="total"></div>
    <button onclick="borrarTodo()" style="background:#eee;color:#333;margin-top:10px">Borrar todo</button>
  </div>
</div>

<!-- SECCION REPORTE -->
<div id="sec-reporte" style="display:none">
  <button class="btn-back" onclick="ir('menu')">← Volver al menú</button>
  <div class="card">
    <h3 style="margin:0">🚚 Reporte de entrega</h3>
    <p style="color:#666;font-size:13px;margin:6px 0">Palomea cada cliente cuando pague o cuando le entregues.</p>
    <div id="lista-reporte"></div>
  </div>
</div>

</div>
<script>
let pedidos = JSON.parse(localStorage.getItem('pedidos')||'[]');
pedidos = pedidos.map(p=>({pagado:false, entregado:false, ...p}));
function guardar(){localStorage.setItem('pedidos',JSON.stringify(pedidos));mostrar();}
function ir(vista){
  document.getElementById('menu').style.display = vista==='menu'?'block':'none';
  document.getElementById('sec-pedidos').style.display = vista==='pedidos'?'block':'none';
  document.getElementById('sec-reporte').style.display = vista==='reporte'?'block':'none';
  mostrar(); window.scrollTo(0,0);
}
function agregar(){
  let c=document.getElementById('cliente').value.trim();
  let p=document.getElementById('producto').value.trim();
  let pr=parseFloat(document.getElementById('precio').value||0);
  let cant=parseInt(document.getElementById('cantidad').value||1);
  if(!c||!p){alert('Falta cliente o producto');return;}
  pedidos.unshift({c,p,pr,cant,pagado:false,entregado:false,fecha:new Date().toLocaleString()});
  document.getElementById('cliente').value='';document.getElementById('producto').value='';document.getElementById('precio').value='';
  guardar();
}
function eliminar(i){if(confirm('¿Eliminar este pedido?')){pedidos.splice(i,1);guardar();}}
function borrarTodo(){if(confirm('¿Borrar todo?')){pedidos=[];guardar();}}
function toggle(i,campo){pedidos[i][campo]=!pedidos[i][campo];guardar();}
function mostrar(){
  let h='';let tot=0;
  pedidos.forEach((x,i)=>{
    let sub=x.pr*x.cant;tot+=sub;
    h+=`<div class="pedido"><b>${x.c} - ${x.p}</b><div class="small">${x.cant} x $${x.pr} = $${sub}<br>${x.fecha||''}</div>
    <div class="check-row">
      <label class="check-box ${x.pagado?'on-pagado':''}"><input type="checkbox" ${x.pagado?'checked':''} onchange="toggle(${i},'pagado')"> Pagado</label>
      <label class="check-box ${x.entregado?'on-entregado':''}"><input type="checkbox" ${x.entregado?'checked':''} onchange="toggle(${i},'entregado')"> Entregado</label>
    </div>
    <button class="del" onclick="eliminar(${i})">Eliminar</button></div>`;
  });
  if(!pedidos.length) h='<p style="color:#888">Aún no hay pedidos</p>';
  document.getElementById('lista').innerHTML=h;
  document.getElementById('total').innerText='Total: $'+tot;

  // REPORTE - SOLO NOMBRE DEL CLIENTE
  let hr='';
  pedidos.forEach((x,i)=>{
    hr+=`<div class="pedido"><div class="nombre-cliente">${x.c}</div>
    <div class="check-row">
      <label class="check-box ${x.pagado?'on-pagado':''}"><input type="checkbox" ${x.pagado?'checked':''} onchange="toggle(${i},'pagado')"> Pagado</label>
      <label class="check-box ${x.entregado?'on-entregado':''}"><input type="checkbox" ${x.entregado?'checked':''} onchange="toggle(${i},'entregado')"> Entregado</label>
    </div></div>`;
  });
  if(!pedidos.length) hr='<p style="color:#888">Aún no hay clientes guardados.<br>Agrega pedidos primero en la sección Pedidos.</p>';
  document.getElementById('lista-reporte').innerHTML=hr;

  document.getElementById('r-total').innerText=pedidos.length;
  document.getElementById('r-pagado').innerText=pedidos.filter(x=>x.pagado).length;
  document.getElementById('r-entregado').innerText=pedidos.filter(x=>x.entregado).length;
}
mostrar();
</script>
</body>
</html>
