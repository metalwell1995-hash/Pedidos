<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Pedidos</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f2f2f2}
header{background:#111;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:800}
.wrap{padding:14px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700}
.pedido{border-top:1px solid #eee;padding:10px 0}
.pedido b{font-size:16px} .small{color:#666;font-size:13px}
.del{background:#ff3b30;margin-top:8px}
.total{font-size:18px;font-weight:800;text-align:right}
</style>
</head>
<body>
<header>📦 MIS PEDIDOS</header>
<div class="wrap">
<div class="card">
<h3 style="margin:0">Nuevo Pedido</h3>
<input id="cliente" placeholder="Nombre del cliente">
<input id="producto" placeholder="Producto">
<input id="precio" type="number" placeholder="Precio $">
<input id="cantidad" type="number" value="1" placeholder="Cantidad">
<select id="estado"><option>Pendiente</option><option>Entregado</option><option>Pagado</option></select>
<button onclick="agregar()">+ Agregar Pedido</button>
</div>
<div class="card">
<h3 style="margin:0">Pedidos Guardados</h3>
<div id="lista"></div>
<div class="total" id="total"></div>
<button onclick="borrarTodo()" style="background:#eee;color:#333;margin-top:10px">Borrar todo</button>
</div>
</div>
<script>
let pedidos = JSON.parse(localStorage.getItem('pedidos')||'[]');
function guardar(){localStorage.setItem('pedidos',JSON.stringify(pedidos));mostrar();}
function agregar(){
let c=document.getElementById('cliente').value;
let p=document.getElementById('producto').value;
let pr=parseFloat(document.getElementById('precio').value||0);
let cant=parseInt(document.getElementById('cantidad').value||1);
let e=document.getElementById('estado').value;
if(!c||!p){alert('Falta cliente o producto');return;}
pedidos.unshift({c,p,pr,cant,e,fecha:new Date().toLocaleString()});
document.getElementById('cliente').value='';document.getElementById('producto').value='';document.getElementById('precio').value='';
guardar();
}
function eliminar(i){pedidos.splice(i,1);guardar();}
function borrarTodo(){if(confirm('¿Borrar todo?')){pedidos=[];guardar();}}
function mostrar(){
let h='';let tot=0;
pedidos.forEach((x,i)=>{
let sub=x.pr*x.cant;tot+=sub;
h+=`<div class="pedido"><b>${x.c} - ${x.p}</b><div class="small">${x.cant} x $${x.pr} = $${sub} | ${x.e}<br>${x.fecha}</div><button class="del" onclick="eliminar(${i})">Eliminar</button></div>`;
});
if(!pedidos.length) h='<p style="color:#888">Aún no hay pedidos</p>';
document.getElementById('lista').innerHTML=h;
document.getElementById('total').innerText='Total: $'+tot;
}
mostrar();
</script>
</body>
</html>
